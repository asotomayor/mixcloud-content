<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Primitive State #004 — Hypnotic / Mental Techno</title>

        <style>
            :root {
                --bg: #0b0b0b;
                --panel: #151515;
                --panel-hover: #1d1d1d;
                --border: #2a2a2a;
                --text: #f2f2f2;
                --muted: #8e8e8e;
                --accent: #ffffff;
                --active: #242424;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 40px 20px;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
            }

            .container {
                width: 100%;
                max-width: 850px;
                margin: 0 auto;
            }

            h1 {
                margin: 0;
                font-size: 30px;
                font-weight: 600;
                letter-spacing: -0.5px;
            }

            .subtitle {
                margin-top: 8px;
                color: var(--muted);
                font-size: 15px;
            }

            .player {
                margin-top: 28px;
                width: 100%;
                overflow: hidden;
                border-radius: 10px;
                background: #111;
            }

            .player iframe {
                display: block;
                width: 100%;
                height: 180px;
                border: 0;
            }

            .tracklist {
                margin-top: 28px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .track {
                display: flex;
                align-items: center;
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--border);
                border-radius: 7px;
                background: var(--panel);
                color: var(--text);
                text-align: left;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.1s ease;
            }

            .track:hover {
                background: var(--panel-hover);
                border-color: #444;
            }

            .track:active {
                transform: scale(0.995);
            }

            .track.active {
                background: var(--active);
                border-color: #666;
            }

            .track-number {
                width: 34px;
                flex-shrink: 0;
                color: var(--muted);
                font-size: 13px;
                font-variant-numeric: tabular-nums;
            }

            .track-time {
                width: 52px;
                flex-shrink: 0;
                color: var(--muted);
                font-size: 13px;
                font-variant-numeric: tabular-nums;
            }

            .track-seek {
                appearance: none;
                -webkit-appearance: none;
                border: 0;
                background: transparent;
                padding: 0;
                margin: 0;
                text-align: left;
                cursor: pointer;
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            .track-seek:hover,
            .track-seek:focus-visible {
                color: #fff;
                outline: none;
            }

            .track-info {
                flex: 1;
                min-width: 0;
            }

            .track-artist {
                font-size: 14px;
                font-weight: 600;
            }

            .track-title {
                margin-top: 2px;
                color: #b5b5b5;
                font-size: 14px;
            }

            .track-actions {
                display: flex;
                gap: 6px;
                margin-left: 12px;
                flex-shrink: 0;
            }

            .track-action {
                padding: 5px 8px;
                border: 1px solid #333;
                border-radius: 5px;
                background: transparent;
                color: #aaa;
                font-size: 11px;
                cursor: pointer;
                white-space: nowrap;
            }

            .track-action:hover {
                color: #fff;
                border-color: #555;
                background: #222;
            }

            .tracklist-loading {
                padding: 18px 0;
                color: var(--muted);
                font-size: 13px;
            }

            .status {
                margin-top: 18px;
                color: var(--muted);
                font-size: 13px;
                min-height: 20px;
            }

            .mixcloud-link {
                display: inline-block;
                margin-top: 18px;
                color: var(--text);
                font-size: 14px;
                text-decoration: none;
                border-bottom: 1px solid #555;
                padding-bottom: 2px;
            }

            .mixcloud-link:hover {
                border-color: #fff;
            }

            .copied {
                color: #fff;
            }

            @media (max-width: 600px) {
                body {
                    padding: 24px 12px;
                }

                h1 {
                    font-size: 24px;
                }

                .player iframe {
                    height: 160px;
                }

                .track {
                    padding: 11px 10px;
                }

                .track-number {
                    width: 28px;
                }

                .track-time {
                    width: 48px;
                }

                .track-actions {
                    margin-left: 8px;
                }

                .track-action {
                    padding: 5px 6px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>Primitive State #004</h1>

            <div class="subtitle">Hypnotic / Mental Techno · 60:17</div>

            <div class="player">
                <iframe
                    id="mixcloud-player"
                    src="https://www.mixcloud.com/widget/iframe/?hide_cover=1&hide_tracklist=1&feed=%2Fanttoss%2Fprimitive-state-004-hypnotic-mental-techno%2F"
                    allow="autoplay"
                    title="Primitive State #004 — Mixcloud player"
                >
                </iframe>
            </div>

            <div class="tracklist" id="tracklist">
                <div class="tracklist-loading">Loading tracklist from Mixcloud…</div>
            </div>

            </div>

            <div class="status" id="status">Loading Mixcloud player…</div>

            <a
                class="mixcloud-link"
                href="https://www.mixcloud.com/anttoss/primitive-state-004-hypnotic-mental-techno/"
                target="_blank"
                rel="noopener"
            >
                Open on Mixcloud ↗
            </a>
        </div>

        <script src="https://widget.mixcloud.com/media/js/widgetApi.js"></script>

        <script>
            const iframe = document.getElementById("mixcloud-player");
            const status = document.getElementById("status");
            const tracklist = document.getElementById("tracklist");
            let tracks = [];

            const widget = Mixcloud.PlayerWidget(iframe);

            const MIXCLOUD_API_URL =
                "https://api.mixcloud.com/anttoss/primitive-state-004-hypnotic-mental-techno/";

            // Local fallback: keeps the page usable if the public API is unavailable.
            const FALLBACK_TRACKS = [
                [0, "Ben Klock", "Prefix"],
                [222, "Franco Rossi", "Antiqua"],
                [441, "Unicel", "Cells"],
                [655, "Nortsch", "Xeno"],
                [922, "Ricardo Garduno", "Heartbroken"],
                [1090, "Mark Broom", "VV2"],
                [1266, "Disguised", "Crusher Wheels"],
                [1460, "Red Rooms", "Endurance"],
                [1658, "CULT", "Next Door Hates Me (Khas Remix)"],
                [1849, "KUSS", "Light In Sight"],
                [2137, "Regent", "Interpolation"],
                [2405, "Kashpitzky", "Avalon"],
                [2631, "Marco Bailey, DJ Dextro", "Shade (DJ Dextro Remix)"],
                [2845, "Sciahri", "Two Letters"],
                [3097, "VEILBORN", "Coded Sword"],
                [3337, "Fhase 87", "French.Loops. 21.B"]
            ];

            function formatTime(seconds) {
                const total = Math.max(0, Math.floor(Number(seconds) || 0));
                const minutes = Math.floor(total / 60);
                const secs = String(total % 60).padStart(2, "0");
                return minutes + ":" + secs;
            }

            function escapeHtml(value) {
                return String(value ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function normalizeSections(data) {
                const sections = Array.isArray(data?.sections)
                    ? data.sections
                    : Array.isArray(data?.data?.sections)
                      ? data.data.sections
                      : [];

                return sections
                    .map(function (section) {
                        const start = Number(section.start_time);
                        const artist = section.artist;
                        const song = section.song;

                        if (!Number.isFinite(start) || start < 0 || !artist || !song) {
                            return null;
                        }

                        return {
                            time: Math.floor(start),
                            artist: String(artist),
                            title: String(song)
                        };
                    })
                    .filter(Boolean)
                    .sort(function (a, b) {
                        return a.time - b.time;
                    });
            }

            function renderTracklist(sectionData, sourceLabel) {
                tracklist.innerHTML = sectionData
                    .map(function (item, index) {
                        const time = formatTime(item.time);

                        return `
                            <div class="track" data-time="${item.time}">
                                <div class="track-number">${String(index + 1).padStart(2, "0")}</div>
                                <button class="track-time track-seek" type="button" data-seek="${item.time}" aria-label="Jump to ${time}">${time}</button>
                                <div class="track-info">
                                    <div class="track-artist">${escapeHtml(item.artist)}</div>
                                    <div class="track-title">${escapeHtml(item.title)}</div>
                                </div>
                                <div class="track-actions">
                                    <button class="track-action play-button" type="button">Play from here</button>
                                    <button class="track-action copy-button" type="button">Copy link</button>
                                </div>
                            </div>`;
                    })
                    .join("");

                tracks = Array.from(document.querySelectorAll(".track"));
                wireTrackButtons();

                status.textContent =
                    sourceLabel + " · " + tracks.length + " tracks loaded";
            }

            async function loadTracklist() {
                try {
                    const response = await fetch(MIXCLOUD_API_URL, {
                        headers: { Accept: "application/json" }
                    });

                    if (!response.ok) {
                        throw new Error("Mixcloud API returned HTTP " + response.status);
                    }

                    const data = await response.json();
                    const sections = normalizeSections(data);

                    if (!sections.length) {
                        throw new Error("No public track sections found in the API response.");
                    }

                    renderTracklist(sections, "Mixcloud API");
                } catch (error) {
                    console.warn("Could not load Mixcloud tracklist:", error);

                    renderTracklist(
                        FALLBACK_TRACKS.map(function (item) {
                            return {
                                time: item[0],
                                artist: item[1],
                                title: item[2]
                            };
                        }),
                        "Saved fallback tracklist"
                    );
                }
            }

            /*
             * ------------------------------------------------------------
             * Helpers
             * ------------------------------------------------------------
             */

            function setActiveTrack(track) {
                tracks.forEach(function (item) {
                    item.classList.remove("active");
                });

                if (track) {
                    track.classList.add("active");
                }
            }

            function getTrackForTime(seconds) {
                let currentTrack = null;

                for (const track of tracks) {
                    const start = Number(track.dataset.time);

                    if (seconds >= start) {
                        currentTrack = track;
                    } else {
                        break;
                    }
                }

                return currentTrack;
            }

            function updateUrl(seconds) {
                const url = new URL(window.location.href);

                if (seconds === 0) {
                    url.searchParams.delete("t");
                } else {
                    url.searchParams.set("t", Math.round(seconds));
                }

                window.history.replaceState({}, "", url);
            }

            function getInitialTime() {
                const params = new URLSearchParams(window.location.search);
                const value = Number(params.get("t"));

                if (!Number.isFinite(value) || value < 0) {
                    return null;
                }

                return value;
            }

            /*
             * ------------------------------------------------------------
             * Seek to a track
             * ------------------------------------------------------------
             */

            async function seekToTrack(track, updateBrowserUrl = true) {
                const seconds = Number(track.dataset.time);

                status.textContent =
                    "Seeking to " +
                    track.querySelector(".track-time").textContent +
                    "…";

                try {
                    const success = await widget.seek(seconds);

                    if (success) {
                        setActiveTrack(track);

                        if (updateBrowserUrl) {
                            updateUrl(seconds);
                        }

                        status.textContent =
                            "Starting at " +
                            track.querySelector(".track-time").textContent +
                            " — " +
                            track.querySelector(".track-artist").textContent +
                            " – " +
                            track.querySelector(".track-title").textContent;
                    } else {
                        status.textContent = "Mixcloud did not allow the seek.";
                    }
                } catch (error) {
                    console.error(error);
                    status.textContent =
                        "Unable to seek in the Mixcloud player.";
                }
            }

            /*
             * ------------------------------------------------------------
             * Copy deep link
             * ------------------------------------------------------------
             */

            async function copyTrackLink(track, button) {
                const seconds = Number(track.dataset.time);
                const url = new URL(window.location.href);

                if (seconds === 0) {
                    url.searchParams.delete("t");
                } else {
                    url.searchParams.set("t", seconds);
                }

                try {
                    await navigator.clipboard.writeText(url.toString());

                    const originalText = button.textContent;
                    button.textContent = "Copied!";
                    button.classList.add("copied");

                    setTimeout(function () {
                        button.textContent = originalText;
                        button.classList.remove("copied");
                    }, 1500);
                } catch (error) {
                    console.error(error);

                    status.textContent =
                        "Could not copy the link. Copy it manually from the address bar.";
                }
            }

            /*
             * ------------------------------------------------------------
             * Clickable timestamps
             * ------------------------------------------------------------
             */

            tracks.forEach(function (track) {
                const timeButton = track.querySelector(".track-seek");

                if (!timeButton) {
                    return;
                }

                timeButton.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    seekToTrack(track, true);
                });
            });

            /*
             * ------------------------------------------------------------
             * Track buttons
             * ------------------------------------------------------------
             */

            function wireTrackButtons() {
                tracks.forEach(function (track) {
                    const playButton = track.querySelector(".play-button");
                    const copyButton = track.querySelector(".copy-button");
                    const timeButton = track.querySelector(".track-seek");

                    playButton.addEventListener("click", function (event) {
                        event.stopPropagation();
                        seekToTrack(track, true);
                    });

                    copyButton.addEventListener("click", function (event) {
                        event.stopPropagation();
                        copyTrackLink(track, copyButton);
                    });

                    timeButton.addEventListener("click", function (event) {
                        event.stopPropagation();
                        seekToTrack(track, true);
                    });

                    track.addEventListener("click", function () {
                        seekToTrack(track, true);
                    });
                });
            }

            /*
             * Load the public Mixcloud tracklist. The API documents CORS-enabled
             * reads and exposes section start_time/artist/song values.
             */
            loadTracklist();

            /*
             * ------------------------------------------------------------
             * Mixcloud widget ready
             * ------------------------------------------------------------
             */

            widget.ready.then(async function () {
                status.textContent = "Player ready";

                /*
                 * If the page was opened with:
                 *
                 * ?t=222
                 *
                 * automatically seek to that position.
                 */
                const initialTime = getInitialTime();

                if (initialTime !== null) {
                    /*
                     * Find the corresponding track for highlighting.
                     */
                    const initialTrack = getTrackForTime(initialTime);

                    if (initialTrack) {
                        setActiveTrack(initialTrack);
                    }

                    /*
                     * Give the widget a moment to become fully usable.
                     */
                    setTimeout(async function () {
                        try {
                            const success = await widget.seek(initialTime);

                            if (success) {
                                if (initialTrack) {
                                    status.textContent =
                                        "Starting at " +
                                        initialTrack.querySelector(
                                            ".track-time",
                                        ).textContent +
                                        " — " +
                                        initialTrack.querySelector(
                                            ".track-artist",
                                        ).textContent +
                                        " – " +
                                        initialTrack.querySelector(
                                            ".track-title",
                                        ).textContent;
                                } else {
                                    status.textContent =
                                        "Starting at " +
                                        Math.floor(initialTime / 60) +
                                        ":" +
                                        String(
                                            Math.floor(initialTime % 60),
                                        ).padStart(2, "0");
                                }
                            } else {
                                status.textContent =
                                    "The requested timestamp could not be loaded.";
                            }
                        } catch (error) {
                            console.error(error);

                            status.textContent =
                                "Could not seek to the requested timestamp.";
                        }
                    }, 500);
                }
            });

            /*
             * ------------------------------------------------------------
             * Automatically highlight the track currently playing.
             *
             * Mixcloud's progress event provides:
             *
             *   position
             *   duration
             *
             * ------------------------------------------------------------
             */

            widget.events.progress.on(function (position, duration) {
                const currentTrack = getTrackForTime(position);

                if (!currentTrack) {
                    return;
                }

                const previousActive = document.querySelector(".track.active");

                if (previousActive !== currentTrack) {
                    setActiveTrack(currentTrack);
                }
            });

            /*
             * ------------------------------------------------------------
             * Playback events
             * ------------------------------------------------------------
             */

            widget.events.play.on(function () {
                const active = document.querySelector(".track.active");

                if (active) {
                    status.textContent =
                        "Playing — " +
                        active.querySelector(".track-artist").textContent +
                        " – " +
                        active.querySelector(".track-title").textContent;
                } else {
                    status.textContent = "Playing";
                }
            });

            widget.events.pause.on(function () {
                const active = document.querySelector(".track.active");

                if (active) {
                    status.textContent =
                        "Paused — " +
                        active.querySelector(".track-artist").textContent +
                        " – " +
                        active.querySelector(".track-title").textContent;
                } else {
                    status.textContent = "Paused";
                }
            });

            widget.events.ended.on(function () {
                status.textContent = "Finished";
            });

            widget.events.error.on(function (error) {
                console.error("Mixcloud player error:", error);
                status.textContent = "Mixcloud player error.";
            });
        </script>
    </body>
</html>
